name: Deploy Astro site to Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/font-subset-requirements.txt
      - name: Restore static font cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: |
            .cache/inexistence-fonts/
            public/fonts/static/
          key: fonts-static-${{ runner.os }}-${{ hashFiles('package-lock.json', 'src/**', 'scripts/fonts-ensure.mjs', 'scripts/generate-font-subsets.py', 'tools/font-subset-requirements.txt') }}
      - name: Restore responsive image cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: |
            public/assets/responsive/
          key: responsive-images-${{ runner.os }}-${{ hashFiles('package-lock.json', 'public/assets/**', 'scripts/generate-responsive-images.mjs', 'src/generated/responsive-images.json') }}
      - name: Install dependencies
        run: npm ci
      - name: Build
        env:
          PUBLIC_WALINE_SERVER_URL: ${{ vars.WALINE_SERVER_URL }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          STRICT_COMMENT_FONT_VENDOR: "1"
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
